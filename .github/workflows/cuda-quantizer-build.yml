permissions:
  contents: read

jobs:
  sm75-build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host compiler
        run: apt-get update && apt-get install -y --no-install-recommends build-essential python3
      - name: Build CPU and CUDA quantizers
        run: make -C gguf-tools deepseek4-quantize deepseek4-quantize-cuda test-quants-cuda test-quants-experimental CUDA_ARCH=sm_75
      - name: Run experimental routed-quant regressions
        run: ./gguf-tools/test-quants-experimental
      - name: Build CUDA quality scorer
        run: make -C gguf-tools quality-score CUDA_ARCH=sm_75
      - name: Build SM75 engine and CUDA regressions
        run: make ds4-bench tests/cuda_long_context_smoke tests/cuda_sm75_profile_harness tests/cuda_sm75_decode_weight_profile tests/cuda_sm75_int4_mma tests/cuda_sm75_q3_q4_32 tests/cuda_sm75_q4_down_native tests/test_engine_mgpu_placement tests/test_gpu_xdev tests/cuda_attention_rowsplit_xdev tests/cuda_sm75_pair_stability CUDA_ARCH=sm_75
      - name: Run CPU placement regressions
        run: ./tests/test_engine_mgpu_placement
      - name: Check Q8 partner A/B tooling
        run: |
          bash -n speed-bench/cuda-q8-partner-offload-ab.sh
          test -x speed-bench/cuda-q8-partner-production-validation.sh
          bash -n speed-bench/cuda-q8-partner-production-validation.sh
          test -x speed-bench/cuda-q8-partner-quality-isolation.sh
          bash -n speed-bench/cuda-q8-partner-quality-isolation.sh
          test -x speed-bench/cuda-q8-fp16-full-quality.sh
          bash -n speed-bench/cuda-q8-fp16-full-quality.sh
          test -x speed-bench/cuda-q8-t256-placement-ab.sh
          bash -n speed-bench/cuda-q8-t256-placement-ab.sh
          test -x speed-bench/cuda-q8-partner-arithmetic-isolation.sh
          bash -n speed-bench/cuda-q8-partner-arithmetic-isolation.sh
          test -x speed-bench/cuda-q8-partner-native-exact.sh
          bash -n speed-bench/cuda-q8-partner-native-exact.sh
          test -x speed-bench/cuda-sm75-native-q4-t256-profile.sh
          bash -n speed-bench/cuda-sm75-native-q4-t256-profile.sh
          test -x speed-bench/cuda-sm75-indexer-production-trace.sh
          bash -n speed-bench/cuda-sm75-indexer-production-trace.sh
          test -x speed-bench/cuda-sm75-indexer-f16-operands.sh
          bash -n speed-bench/cuda-sm75-indexer-f16-operands.sh
          test -x speed-bench/cuda-sm75-q32-production-profile.sh
          bash -n speed-bench/cuda-sm75-q32-production-profile.sh
          test -x speed-bench/cuda-sm75-decode-baseline.sh
          bash -n speed-bench/cuda-sm75-decode-baseline.sh
          test -x speed-bench/cuda-sm75-decode-evidence.sh
          bash -n speed-bench/cuda-sm75-decode-evidence.sh
          test -x speed-bench/cuda-sm75-decode-crash-isolation.sh
          bash -n speed-bench/cuda-sm75-decode-crash-isolation.sh
          test -x speed-bench/cuda-sm75-decode-graph-ab.sh
          bash -n speed-bench/cuda-sm75-decode-graph-ab.sh
          test -x speed-bench/cuda-sm75-decode-q3a4-ksplit.sh
          bash -n speed-bench/cuda-sm75-decode-q3a4-ksplit.sh
          test -x speed-bench/cuda-sm75-decode-q4down-tile32.sh
          bash -n speed-bench/cuda-sm75-decode-q4down-tile32.sh
          test -x speed-bench/cuda-sm75-decode-q3a4-prefetch.sh
          bash -n speed-bench/cuda-sm75-decode-q3a4-prefetch.sh
          test -x speed-bench/cuda-sm75-decode-q3a4-prefetch2-production-ab.sh
          bash -n speed-bench/cuda-sm75-decode-q3a4-prefetch2-production-ab.sh
          ! grep -Eq '<<[[:space:]]*EOF' speed-bench/cuda-sm75-decode-q3a4-prefetch2-production-ab.sh
          test -x speed-bench/cuda-sm75-decode-q3a4-k4-production-ab.sh
          bash -n speed-bench/cuda-sm75-decode-q3a4-k4-production-ab.sh
          ! grep -Eq '<<[[:space:]]*EOF' speed-bench/cuda-sm75-decode-q3a4-k4-production-ab.sh
          test -x speed-bench/cuda-sm75-decode-q4-production-ab.sh
          bash -n speed-bench/cuda-sm75-decode-q4-production-ab.sh
          test -x speed-bench/cuda-sm75-pair-stability-matrix.sh
          bash -n speed-bench/cuda-sm75-pair-stability-matrix.sh
          test -x speed-bench/cuda-sm75-xdev-feature-isolation.sh
          bash -n speed-bench/cuda-sm75-xdev-feature-isolation.sh
          test -x speed-bench/cuda-sm75-iq2-next-ab.sh
          bash -n speed-bench/cuda-sm75-iq2-next-ab.sh
          test -x speed-bench/cuda-sm75-critical-path-audit.sh
          bash -n speed-bench/cuda-sm75-critical-path-audit.sh
          bash -n speed-bench/cuda-sm75-attention-rowsplit.sh
          test -x speed-bench/cuda-sm75-q3-q4-real-quality.sh
          bash -n speed-bench/cuda-sm75-q3-q4-real-quality.sh
          test -x speed-bench/cuda-sm75-attention-rowsplit-production-ab.sh
          bash -n speed-bench/cuda-sm75-attention-rowsplit-production-ab.sh
          test -x speed-bench/cuda-sm75-long-prompt-word-smoke.sh
          bash -n speed-bench/cuda-sm75-long-prompt-word-smoke.sh
          python3 -m py_compile speed-bench/q8_partner_audit.py
          python3 -m py_compile speed-bench/summarize-q8-partner-offload-ab.py
          python3 -m py_compile speed-bench/summarize-q8-partner-production.py
          python3 -m py_compile speed-bench/summarize-q8-partner-quality-isolation.py
          python3 -m py_compile speed-bench/summarize-q8-fp16-full-quality.py
          python3 -m py_compile speed-bench/summarize-q8-t256-placement.py
          python3 -m py_compile speed-bench/summarize-q8-partner-arithmetic.py
          python3 -m py_compile speed-bench/summarize-q8-partner-native-exact.py
          python3 -m py_compile speed-bench/summarize-sm75-native-q4-t256-profile.py
          python3 -m py_compile speed-bench/summarize-sm75-indexer-production-trace.py
          python3 -m py_compile speed-bench/summarize-sm75-indexer-f16-operands.py
          python3 -m py_compile speed-bench/summarize-sm75-q32-production-profile.py
          python3 -m py_compile speed-bench/summarize-sm75-decode-baseline.py
          python3 -m py_compile speed-bench/summarize-sm75-decode-evidence.py
          python3 -m py_compile speed-bench/summarize-sm75-decode-crash-isolation.py
          python3 -m py_compile speed-bench/summarize-sm75-xdev-feature-isolation.py
          python3 -m py_compile speed-bench/validate-sm75-q32-production-log.py
          python3 -m py_compile tests/test_summarize_q8_partner_offload_ab.py
          python3 -m py_compile tests/test_summarize_q8_partner_production.py
          python3 -m py_compile tests/test_summarize_q8_partner_quality_isolation.py
          python3 -m py_compile tests/test_summarize_q8_fp16_full_quality.py
          python3 -m py_compile tests/test_summarize_q8_t256_placement.py
          python3 -m py_compile tests/test_summarize_q8_partner_arithmetic.py
          python3 -m py_compile tests/test_summarize_q8_partner_native_exact.py
          python3 -m py_compile tests/test_summarize_sm75_native_q4_t256_profile.py
          python3 -m py_compile tests/test_summarize_sm75_indexer_production_trace.py
          python3 -m py_compile tests/test_summarize_sm75_indexer_f16_operands.py
          python3 -m py_compile tests/test_summarize_sm75_decode_baseline.py
          python3 -m py_compile tests/test_summarize_sm75_decode_evidence.py
          python3 -m py_compile tests/test_summarize_sm75_decode_crash_isolation.py
          python3 -m py_compile tests/test_summarize_sm75_xdev_feature_isolation.py
          python3 tests/test_summarize_q8_partner_offload_ab.py
          python3 tests/test_summarize_q8_partner_production.py
          python3 tests/test_summarize_q8_partner_quality_isolation.py
          python3 tests/test_summarize_q8_fp16_full_quality.py
          python3 tests/test_summarize_q8_t256_placement.py
          python3 tests/test_summarize_q8_partner_arithmetic.py
          python3 tests/test_summarize_q8_partner_native_exact.py
          python3 tests/test_summarize_sm75_native_q4_t256_profile.py
          python3 tests/test_summarize_sm75_indexer_production_trace.py
          python3 tests/test_summarize_sm75_indexer_f16_operands.py
          python3 tests/test_summarize_sm75_decode_baseline.py
          python3 tests/test_summarize_sm75_decode_evidence.py
          python3 tests/test_summarize_sm75_decode_crash_isolation.py
          python3 tests/test_summarize_sm75_xdev_feature_isolation.py
      - name: Verify production tagged-Q4 SM75 instructions
        run: |
          cuobjdump --list-elf tests/cuda_long_context_smoke | grep -Eqi 'sm_?75'
          cuobjdump --dump-sass tests/cuda_long_context_smoke > /tmp/ds4-sm75.sass
          for kernel in \
            moe_gate_up_mid_sm75_native_q4_tile8_kernel \
            moe_gate_up_mid_sm75_native_q4_tile16_stream7_kernel \
            moe_gate_up_mid_sm75_native_q4_tile16_full64_fused_kernel \
            moe_down_sm75_native_q4_tile_kernel \
            moe_down_sm75_native_q4_tile16_compact7_kernel; do
            grep -Fq "$kernel" /tmp/ds4-sm75.sass
            awk -v wanted="$kernel" '
              /Function : / { emit = index($0, wanted) != 0 }
              emit { print }
            ' /tmp/ds4-sm75.sass > "/tmp/$kernel.sass"
            grep -Eq 'IMMA[^[:space:]]*8832|IMMA\.8832' "/tmp/$kernel.sass"
            grep -Eq 'IMMA\.8832\.U4\.U4' "/tmp/$kernel.sass"
            grep -Eq 'IMMA\.8832\.S4\.U4' "/tmp/$kernel.sass"
            ! grep -Eq '(^|[[:space:]])(LDL|STL)([[:space:].]|$)' "/tmp/$kernel.sass"
          done
          cuobjdump --dump-resource-usage tests/cuda_long_context_smoke \
            | c++filt > /tmp/ds4-sm75.resources
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path("/tmp/ds4-sm75.resources").read_text(errors="replace").splitlines()
          targets = (
              "moe_gate_up_mid_sm75_native_q4_tile8_kernel",
              "moe_gate_up_mid_sm75_native_q4_tile16_stream7_kernel",
              "moe_down_sm75_native_q4_tile16_compact7_kernel",
              "moe_gate_up_mid_sm75_native_q4_tile16_full64_fused_kernel",
              "moe_down_sm75_native_q4_tile_kernel",
          )
          found = {target: 0 for target in targets}
          fixed_k16_found = 0
          for index, line in enumerate(lines):
              for target in targets:
                  if "Function" not in line or target not in line:
                      continue
                  record = next((item for item in lines[index + 1:index + 8]
                                 if re.match(r"\s*REG:", item)), "")
                  values = {key: int(value) for key, value in
                            re.findall(r"\b(REG|STACK|SHARED|LOCAL):(\d+)", record)}
                  if set(values) != {"REG", "STACK", "SHARED", "LOCAL"}:
                      raise SystemExit(f"missing resource fields for {target}: {record}")
                  if values["STACK"] or values["LOCAL"]:
                      raise SystemExit(f"{target} has local-memory traffic: {values}")
                  if values["REG"] > 128:
                      raise SystemExit(f"{target} exceeds the SM75 register gate: {values}")
                  if target == "moe_gate_up_mid_sm75_native_q4_tile8_kernel":
                      match = re.search(
                          r"tile8_kernel<\s*\d+u?\s*,\s*\d+u?\s*,\s*(\d+)u?\s*>",
                          line,
                      )
                      if match and int(match.group(1)) == 16:
                          fixed_k16_found += 1
                  if target.endswith("stream7_kernel") or target.endswith("compact7_kernel"):
                      if values["SHARED"] >= 32768:
                          raise SystemExit(
                              f"{target} cannot admit two 256-thread CTAs: {values}"
                          )
                  if target.endswith("full64_fused_kernel") and values["SHARED"] != 0:
                      raise SystemExit(
                          f"{target} must reserve all 64 KiB dynamically: {values}"
                      )
                  found[target] += 1
          if any(count == 0 for count in found.values()):
              raise SystemExit(f"missing stream7/compact7 resource records: {found}")
          if fixed_k16_found == 0:
              raise SystemExit("missing fixed-K16 native-Q4 Gate resource record")
          print("validated native-Q4 candidate resource ceilings", found)
          PY
      - name: Build SM75 Q4 gate/up with PTXAS evidence
        shell: bash
        run: |
          set -o pipefail
          make -B tests/cuda_sm75_q4_gate_up_native CUDA_ARCH=sm_75 2>&1 \
            | tee /tmp/sm75-q4-gate-up-build.log
      - name: Verify bounded SM75 Q4 N-split candidates
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'down tests/cuda_sm75_q4_down_native sm75_q4_down_native_aw_nsplit_kernel' \
            'gate tests/cuda_sm75_q4_gate_up_native sm75_q4_gate_up_native_aw_nsplit_kernel'; do
            read -r kind binary needle <<<"$spec"
            cuobjdump --dump-sass "$binary" | c++filt >"/tmp/$kind-nsplit.sass"
            cuobjdump --dump-resource-usage "$binary" | c++filt \
              >"/tmp/$kind-nsplit.resources"
            grep -Fq "$needle" "/tmp/$kind-nsplit.sass"
            awk -v wanted="$needle" '
              /Function : / { emit = index($0, wanted) != 0 }
              emit { print }
            ' "/tmp/$kind-nsplit.sass" >"/tmp/$kind-nsplit-only.sass"
            grep -Eq 'IMMA[^[:space:]]*8832|IMMA\.8832' "/tmp/$kind-nsplit-only.sass"
            grep -Eq 'IMMA\.8832\.U4\.U4' "/tmp/$kind-nsplit-only.sass"
            grep -Eq 'IMMA\.8832\.S4\.U4' "/tmp/$kind-nsplit-only.sass"
            ! grep -Eq '(^|[[:space:]])(LDL|STL)([[:space:].]|$)' \
              "/tmp/$kind-nsplit-only.sass"
          done
          python3 - <<'PY'
          import pathlib, re
          targets = {
              "down": "sm75_q4_down_native_aw_nsplit_kernel",
              "gate": "sm75_q4_gate_up_native_aw_nsplit_kernel",
          }
          for kind, needle in targets.items():
              lines = pathlib.Path(f"/tmp/{kind}-nsplit.resources").read_text(
                  errors="replace").splitlines()
              found = set()
              for i, line in enumerate(lines):
                  if "Function" not in line or needle not in line:
                      continue
                  record = next((x for x in lines[i+1:i+8]
                                 if re.match(r"\s*REG:", x)), "")
                  values = {k: int(v) for k, v in
                            re.findall(r"\b(REG|STACK|SHARED|LOCAL):(\d+)", record)}
                  warp = 4 if re.search(r"<\s*4(?:u)?\s*>", line) else (
                      8 if re.search(r"<\s*8(?:u)?\s*>", line) else 0)
                  if not warp:
                      continue
                  if set(values) != {"REG", "STACK", "SHARED", "LOCAL"}:
                      raise SystemExit(f"missing {kind} nsplit{warp} resources")
                  if values["STACK"] or values["LOCAL"]:
                      raise SystemExit(f"{kind} nsplit{warp} local memory: {values}")
                  if values["SHARED"] >= 8192:
                      raise SystemExit(f"{kind} nsplit{warp} shared overflow: {values}")
                  print(kind, warp, values)
                  found.add(warp)
              if found != {4, 8}:
                  raise SystemExit(f"missing {kind} 4/8-warp records: {found}")
          PY
          bash -n speed-bench/cuda-sm75-q4-nsplit.sh
