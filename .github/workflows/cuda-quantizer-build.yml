name: CUDA quantizer build

on:
  push:
    branches: [agent/iq2-iq2-q4, agent/partner-q8-offload]
    paths:
      - ".github/workflows/cuda-quantizer-build.yml"
      - "ds4.c"
      - "ds4.h"
      - "ds4_bench.c"
      - "ds4_cuda.cu"
      - "ds4_cuda_sm75_q4_native.inc.cu"
      - "ds4_gpu.h"
      - "ds4_tensor_layout.h"
      - "ds4_help.c"
      - "Makefile"
      - "speed-bench/cuda-prefill-audit.sh"
      - "speed-bench/cuda-prefill-deep-audit.sh"
      - "speed-bench/cuda-q4-prefill-evidence.sh"
      - "speed-bench/cuda-q4-real-histogram.sh"
      - "speed-bench/cuda-sm75-kernel-profile.sh"
      - "speed-bench/cuda-sm75-int4-mma-experiment.sh"
      - "speed-bench/cuda-sm75-q4-down-native.sh"
      - "speed-bench/cuda-sm75-q4-gate-up-native.sh"
      - "speed-bench/cuda-sm75-production-scalar.sh"
      - "speed-bench/cuda-sm75-production-scalar-e2e.sh"
      - "speed-bench/cuda-sm75-next-targets.sh"
      - "speed-bench/cuda-sm75-native-q4-production.sh"
      - "speed-bench/cuda-sm75-native-q4-next-ab.sh"
      - "speed-bench/cuda-sm75-native-q4-gate-fused-ab.sh"
      - "speed-bench/cuda-q8-partner-offload-ab.sh"
      - "speed-bench/cuda-q8-t32-fused-ab.sh"
      - "speed-bench/summarize-q8-partner-offload-ab.py"
      - "speed-bench/summarize-q8-t32-fused-ab.py"
      - "speed-bench/validate-ncu-capture.py"
      - "speed-bench/summarize-q8-cache-audit.py"
      - "speed-bench/summarize-q4-real-histogram.py"
      - "speed-bench/summarize-prefill-placement.py"
      - "speed-bench/summarize-tile-audit.py"
      - "tests/cuda_long_context_smoke.c"
      - "tests/cuda_sm75_profile_harness.c"
      - "tests/cuda_sm75_int4_mma.cu"
      - "tests/cuda_sm75_q4_down_native.cu"
      - "tests/cuda_sm75_q4_gate_up_native.cu"
      - "tests/cuda_sm75_native_q4_histograms.h"
      - "speed-bench/cuda-sm75-q4-nsplit.sh"
      - "speed-bench/cuda-sm75-q4-persistent.sh"
      - "tests/test_engine_mgpu_placement.c"
      - "tests/test_gpu_xdev.c"
      - "tests/test_summarize_q8_partner_offload_ab.py"
      - "tests/test_summarize_q8_t32_fused_ab.py"
      - "tests/test_summarize_q4_real_histogram.py"
      - "gguf-tools/**"
      - "produce-benchmark-iq2-iq2-q4.sh"
      - "compare-q2-hybrid-q4.sh"

permissions:
  contents: read

jobs:
  sm75-build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host compiler
        run: apt-get update && apt-get install -y --no-install-recommends build-essential python3
      - name: Build CPU and CUDA quantizers
        run: make -C gguf-tools deepseek4-quantize deepseek4-quantize-cuda test-quants-cuda CUDA_ARCH=sm_75
      - name: Build CUDA quality scorer
        run: make -C gguf-tools quality-score CUDA_ARCH=sm_75
      - name: Build SM75 engine and CUDA regressions
        run: make ds4-bench tests/cuda_long_context_smoke tests/cuda_sm75_profile_harness tests/cuda_sm75_int4_mma tests/cuda_sm75_q4_down_native tests/test_engine_mgpu_placement tests/test_gpu_xdev CUDA_ARCH=sm_75
      - name: Verify production tagged-Q4 SM75 instructions
        run: |
          cuobjdump --list-elf tests/cuda_long_context_smoke | grep -Eqi 'sm_?75'
          cuobjdump --dump-sass tests/cuda_long_context_smoke > /tmp/ds4-sm75.sass
          for kernel in \
            moe_gate_up_mid_sm75_native_q4_tile8_kernel \
            moe_gate_up_mid_sm75_native_q4_tile16_stream7_kernel \
            moe_gate_up_mid_sm75_native_q4_tile16_full64_fused_kernel \
            moe_down_sm75_native_q4_tile_kernel \
            moe_down_sm75_native_q4_tile16_compact7_kernel; do
            grep -Fq "$kernel" /tmp/ds4-sm75.sass
            awk -v wanted="$kernel" '
              /Function : / { emit = index($0, wanted) != 0 }
              emit { print }
            ' /tmp/ds4-sm75.sass > "/tmp/$kernel.sass"
            grep -Eq 'IMMA[^[:space:]]*8832|IMMA\.8832' "/tmp/$kernel.sass"
            grep -Eq 'IMMA\.8832\.U4\.U4' "/tmp/$kernel.sass"
            grep -Eq 'IMMA\.8832\.S4\.U4' "/tmp/$kernel.sass"
            ! grep -Eq '(^|[[:space:]])(LDL|STL)([[:space:].]|$)' "/tmp/$kernel.sass"
          done
          cuobjdump --dump-resource-usage tests/cuda_long_context_smoke \
            | c++filt > /tmp/ds4-sm75.resources
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path("/tmp/ds4-sm75.resources").read_text(errors="replace").splitlines()
          targets = (
              "moe_gate_up_mid_sm75_native_q4_tile8_kernel",
              "moe_gate_up_mid_sm75_native_q4_tile16_stream7_kernel",
              "moe_down_sm75_native_q4_tile16_compact7_kernel",
              "moe_gate_up_mid_sm75_native_q4_tile16_full64_fused_kernel",
              "moe_down_sm75_native_q4_tile_kernel",
          )
          found = {target: 0 for target in targets}
          fixed_k16_found = 0
          for index, line in enumerate(lines):
              for target in targets:
                  if "Function" not in line or target not in line:
                      continue
                  record = next((item for item in lines[index + 1:index + 8]
                                 if re.match(r"\s*REG:", item)), "")
                  values = {key: int(value) for key, value in
                            re.findall(r"\b(REG|STACK|SHARED|LOCAL):(\d+)", record)}
                  if set(values) != {"REG", "STACK", "SHARED", "LOCAL"}:
                      raise SystemExit(f"missing resource fields for {target}: {record}")
                  if values["STACK"] or values["LOCAL"]:
                      raise SystemExit(f"{target} has local-memory traffic: {values}")
                  if values["REG"] > 128:
                      raise SystemExit(f"{target} exceeds the SM75 register gate: {values}")
                  if target == "moe_gate_up_mid_sm75_native_q4_tile8_kernel":
                      match = re.search(
                          r"tile8_kernel<\s*\d+u?\s*,\s*\d+u?\s*,\s*(\d+)u?\s*>",
                          line,
                      )
                      if match and int(match.group(1)) == 16:
                          fixed_k16_found += 1
                  if target.endswith("stream7_kernel") or target.endswith("compact7_kernel"):
                      if values["SHARED"] >= 32768:
                          raise SystemExit(
                              f"{target} cannot admit two 256-thread CTAs: {values}"
                          )
                  if target.endswith("full64_fused_kernel") and values["SHARED"] != 0:
                      raise SystemExit(
                          f"{target} must reserve all 64 KiB dynamically: {values}"
                      )
                  found[target] += 1
          if any(count == 0 for count in found.values()):
              raise SystemExit(f"missing stream7/compact7 resource records: {found}")
          if fixed_k16_found == 0:
              raise SystemExit("missing fixed-K16 native-Q4 Gate resource record")
          print("validated native-Q4 candidate resource ceilings", found)
          PY
      - name: Build SM75 Q4 gate/up with PTXAS evidence
        shell: bash
        run: |
          set -o pipefail
          make -B tests/cuda_sm75_q4_gate_up_native CUDA_ARCH=sm_75 2>&1 \
            | tee /tmp/sm75-q4-gate-up-build.log
      - name: Verify bounded SM75 Q4 N-split candidates
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'down tests/cuda_sm75_q4_down_native sm75_q4_down_native_aw_nsplit_kernel' \
            'gate tests/cuda_sm75_q4_gate_up_native sm75_q4_gate_up_native_aw_nsplit_kernel'; do
            read -r kind binary needle <<<"$spec"
            cuobjdump --dump-sass "$binary" | c++filt >"/tmp/$kind-nsplit.sass"
            cuobjdump --dump-resource-usage "$binary" | c++filt \
              >"/tmp/$kind-nsplit.resources"
            grep -Fq "$needle" "/tmp/$kind-nsplit.sass"
            awk -v wanted="$needle" '
              /Function : / { emit = index($0, wanted) != 0 }
              emit { print }
            ' "/tmp/$kind-nsplit.sass" >"/tmp/$kind-nsplit-only.sass"
            grep -Eq 'IMMA[^[:space:]]*8832|IMMA\.8832' "/tmp/$kind-nsplit-only.sass"
            grep -Eq 'IMMA\.8832\.U4\.U4' "/tmp/$kind-nsplit-only.sass"
            grep -Eq 'IMMA\.8832\.S4\.U4' "/tmp/$kind-nsplit-only.sass"
            ! grep -Eq '(^|[[:space:]])(LDL|STL)([[:space:].]|$)' \
              "/tmp/$kind-nsplit-only.sass"
          done
          python3 - <<'PY'
          import pathlib, re
          targets = {
              "down": "sm75_q4_down_native_aw_nsplit_kernel",
              "gate": "sm75_q4_gate_up_native_aw_nsplit_kernel",
          }
          for kind, needle in targets.items():
              lines = pathlib.Path(f"/tmp/{kind}-nsplit.resources").read_text(
                  errors="replace").splitlines()
              found = set()
              for i, line in enumerate(lines):
                  if "Function" not in line or needle not in line:
                      continue
                  record = next((x for x in lines[i+1:i+8]
                                 if re.match(r"\s*REG:", x)), "")
                  values = {k: int(v) for k, v in
                            re.findall(r"\b(REG|STACK|SHARED|LOCAL):(\d+)", record)}
                  warp = 4 if re.search(r"<\s*4(?:u)?\s*>", line) else (
                      8 if re.search(r"<\s*8(?:u)?\s*>", line) else 0)
                  if not warp:
                      continue
                  if set(values) != {"REG", "STACK", "SHARED", "LOCAL"}:
                      raise SystemExit(f"missing {kind} nsplit{warp} resources")
                  if values["STACK"] or values["LOCAL"]:
                      raise SystemExit(f"{kind} nsplit{warp} local memory: {values}")
                  if values["SHARED"] >= 8192:
                      raise SystemExit(f"{kind} nsplit{warp} shared overflow: {values}")
                  print(kind, warp, values)
                  found.add(warp)
              if found != {4, 8}:
                  raise SystemExit(f"missing {kind} 4/8-warp records: {found}")
          PY
          bash -n speed-bench/cuda-sm75-q4-nsplit.sh
      - name: Verify packed-INT4 SM75 instructions
        run: |
          cuobjdump --list-elf tests/cuda_sm75_int4_mma | grep -Eqi 'sm_?75'
          cuobjdump --dump-sass tests/cuda_sm75_int4_mma > /tmp/sm75-int4.sass
          grep -q 'Function : sm75_q4_i8_standard_kernel' /tmp/sm75-int4.sass
          grep -q 'Function : sm75_q4_i4_mixed_standard_kernel' /tmp/sm75-int4.sass
          grep -Eq 'IMMA[^[:space:]]*8816|IMMA\.8816' /tmp/sm75-int4.sass
          grep -Eq 'IMMA[^[:space:]]*8832|IMMA\.8832' /tmp/sm75-int4.sass
      - name: Verify production-shaped SM75 Q4-down instructions
        run: |
          cuobjdump --list-elf tests/cuda_sm75_q4_down_native | grep -Eq '\.sm_75\.cubin([[:space:]]|$)'
          cuobjdump --dump-sass tests/cuda_sm75_q4_down_native > /tmp/sm75-q4-down-native.sass
          grep -q 'Function : sm75_q4_down_standard_kernel' /tmp/sm75-q4-down-native.sass
          grep -q 'Function : sm75_q4_down_native_w_kernel' /tmp/sm75-q4-down-native.sass
          grep -q 'Function : sm75_q4_down_native_aw_kernel' /tmp/sm75-q4-down-native.sass
          awk '/Function : sm75_q4_down_standard_kernel/{emit=1; next} /Function : /{emit=0} emit' \
            /tmp/sm75-q4-down-native.sass > /tmp/sm75-q4-down-standard.sass
          awk '/Function : sm75_q4_down_native_w_kernel/{emit=1; next} /Function : /{emit=0} emit' \
            /tmp/sm75-q4-down-native.sass > /tmp/sm75-q4-down-native-w.sass
          awk '/Function : sm75_q4_down_native_aw_kernel/{emit=1; next} /Function : /{emit=0} emit' \
            /tmp/sm75-q4-down-native.sass > /tmp/sm75-q4-down-native-aw.sass
          grep -Eq 'IMMA[^[:space:]]*8816|IMMA\.8816' /tmp/sm75-q4-down-standard.sass
          grep -Eq 'IMMA\.8832\.U4\.U4' /tmp/sm75-q4-down-native-w.sass
          grep -Eq 'IMMA\.8832\.S4\.U4' /tmp/sm75-q4-down-native-w.sass
          grep -Eq 'IMMA\.8832\.U4\.U4' /tmp/sm75-q4-down-native-aw.sass
          grep -Eq 'IMMA\.8832\.S4\.U4' /tmp/sm75-q4-down-native-aw.sass
          ! grep -Eq '(^|[[:space:]])(LDL|STL)([[:space:].]|$)' /tmp/sm75-q4-down-standard.sass
          ! grep -Eq '(^|[[:space:]])(LDL|STL)([[:space:].]|$)' /tmp/sm75-q4-down-native-w.sass
          ! grep -Eq '(^|[[:space:]])(LDL|STL)([[:space:].]|$)' /tmp/sm75-q4-down-native-aw.sass
      - name: Verify production-shaped SM75 Q4 gate/up instructions
        shell: bash
        run: |
          cuobjdump --list-elf tests/cuda_sm75_q4_gate_up_native | grep -Eq '\.sm_75\.cubin([[:space:]]|$)'
          cuobjdump --dump-sass tests/cuda_sm75_q4_gate_up_native > /tmp/sm75-q4-gate-up-native.sass
          for kernel in \
            sm75_q4_gate_up_standard_kernel \
            sm75_q4_gate_up_standard_warp16_kernel \
            sm75_q4_gate_up_native_w_kernel \
            sm75_q4_gate_up_native_aw_kernel \
            sm75_q4_gate_up_native_aw_warp16_kernel \
            sm75_q4_gate_up_native_aw_stage7_kernel \
            sm75_q4_gate_up_native_aw_stage7_scalar_kernel \
            sm75_q4_gate_up_native_aw_warp16_scalar_kernel \
            sm75_q4_gate_up_native_aw_persistent_seq16_kernel \
            sm75_q4_gate_up_native_aw_persistent_ws16_kernel \
            sm75_q4_gate_up_pack_a_kernel \
            sm75_q4_gate_up_pack_w_kernel; do
            grep -Fq "Function : $kernel" /tmp/sm75-q4-gate-up-native.sass
          done
          extract_sass() {
            awk -v wanted="$2" '
              /Function : / {
                current = $0
                sub(/^.*Function :[[:space:]]*/, "", current)
                sub(/[[:space:]]*$/, "", current)
                emit = current == wanted
              }
              emit { print }
            ' /tmp/sm75-q4-gate-up-native.sass > "/tmp/sm75-q4-gate-up-$1.sass"
          }
          extract_sass standard sm75_q4_gate_up_standard_kernel
          extract_sass standard-warp16 sm75_q4_gate_up_standard_warp16_kernel
          extract_sass native-w sm75_q4_gate_up_native_w_kernel
          extract_sass native-aw sm75_q4_gate_up_native_aw_kernel
          extract_sass native-aw-warp16 sm75_q4_gate_up_native_aw_warp16_kernel
          extract_sass native-aw-stage7 sm75_q4_gate_up_native_aw_stage7_kernel
          extract_sass native-aw-stage7-scalar sm75_q4_gate_up_native_aw_stage7_scalar_kernel
          extract_sass native-aw-warp16-scalar sm75_q4_gate_up_native_aw_warp16_scalar_kernel
          extract_sass native-aw-persistent-seq16 sm75_q4_gate_up_native_aw_persistent_seq16_kernel
          extract_sass native-aw-persistent-ws16 sm75_q4_gate_up_native_aw_persistent_ws16_kernel
          for label in standard standard-warp16; do
            grep -Eq 'IMMA[^[:space:]]*8816|IMMA\.8816' "/tmp/sm75-q4-gate-up-$label.sass"
          done
          for label in native-w native-aw native-aw-warp16 native-aw-stage7 \
              native-aw-stage7-scalar native-aw-warp16-scalar \
              native-aw-persistent-seq16 native-aw-persistent-ws16; do
            grep -Eq 'IMMA[^[:space:]]*8832|IMMA\.8832' "/tmp/sm75-q4-gate-up-$label.sass"
            grep -Eq 'IMMA\.8832\.S4\.U4' "/tmp/sm75-q4-gate-up-$label.sass"
            grep -Eq 'IMMA\.8832\.U4\.U4' "/tmp/sm75-q4-gate-up-$label.sass"
          done
          printf 'label,ldl_instructions,stl_instructions,scalar_local_instruction_gate\n' \
            > /tmp/sm75-q4-gate-up-local-instructions.csv
          for label in standard standard-warp16 native-w native-aw \
              native-aw-warp16 native-aw-stage7 native-aw-stage7-scalar \
              native-aw-warp16-scalar native-aw-persistent-seq16 \
              native-aw-persistent-ws16; do
            ldl=$(grep -Ec '(^|[[:space:]])LDL([[:space:].]|$)' "/tmp/sm75-q4-gate-up-$label.sass" || true)
            stl=$(grep -Ec '(^|[[:space:]])STL([[:space:].]|$)' "/tmp/sm75-q4-gate-up-$label.sass" || true)
            scalar_gate=not-applicable
            if [[ $label == native-aw-stage7-scalar || \
                  $label == native-aw-warp16-scalar || \
                  $label == native-aw-persistent-seq16 || \
                  $label == native-aw-persistent-ws16 ]]; then
              scalar_gate=pass
              if (( ldl != 0 || stl != 0 )); then
                scalar_gate=fail
              fi
            fi
            printf '%s,%s,%s,%s\n' "$label" "$ldl" "$stl" "$scalar_gate" \
              >> /tmp/sm75-q4-gate-up-local-instructions.csv
          done
          awk -F, 'NR == 1 || $1 ~ /-scalar$/ || $1 ~ /-persistent-/ { print }' \
            /tmp/sm75-q4-gate-up-local-instructions.csv
          ! grep -Eq '^native-aw-(stage7-scalar|warp16-scalar|persistent-(seq16|ws16)),[^,]+,[^,]+,fail$' \
            /tmp/sm75-q4-gate-up-local-instructions.csv
          python3 - /tmp/sm75-q4-gate-up-build.log <<'PY'
          import re
          import sys

          wanted = (
              "sm75_q4_gate_up_native_aw_stage7_scalar_kernel",
              "sm75_q4_gate_up_native_aw_warp16_scalar_kernel",
              "sm75_q4_gate_up_native_aw_persistent_seq16_kernel",
              "sm75_q4_gate_up_native_aw_persistent_ws16_kernel",
          )
          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              lines = handle.readlines()
          resources = {}
          current = None
          for line in lines:
              match = re.search(r"Function properties for\s+(\S+)", line)
              if match:
                  current = match.group(1)
                  resources.setdefault(current, {})
                  continue
              stack = re.search(
                  r"(\d+) bytes stack frame,\s*(\d+) bytes spill stores,\s*"
                  r"(\d+) bytes spill loads",
                  line,
              )
              if current is not None and stack:
                  resources[current]["stack"], resources[current]["stores"], resources[current]["loads"] = (
                      int(value) for value in stack.groups()
                  )
                  continue
              registers = re.search(r"Used\s+(\d+) registers", line)
              if current is not None and registers:
                  resources[current]["raw_registers"] = int(registers.group(1))
                  current = None
          print("kernel,raw_registers,allocated_registers,stack_frame_bytes,spill_store_bytes,spill_load_bytes")
          for kernel in wanted:
              row = resources.get(kernel, {})
              missing = {"raw_registers", "stack", "stores", "loads"} - row.keys()
              if missing:
                  raise SystemExit(f"missing PTXAS evidence for {kernel}: {sorted(missing)}")
              allocated = ((row["raw_registers"] + 7) // 8) * 8
              print(
                  f'{kernel},{row["raw_registers"]},{allocated},{row["stack"]},'
                  f'{row["stores"]},{row["loads"]}'
              )
              if row["raw_registers"] > 128 or allocated > 128:
                  raise SystemExit(f"{kernel} exceeds the 128-register gate")
              if row["stack"] != 0:
                  raise SystemExit(f"{kernel} retains a PTXAS stack frame")
              if row["stores"] != 0 or row["loads"] != 0:
                  raise SystemExit(f"{kernel} has PTXAS spill traffic")
          PY
      - name: Run CPU placement regressions
        run: ./tests/test_engine_mgpu_placement
      - name: Check comparison suite tools
        run: |
          bash -n compare-q2-hybrid-q4.sh
          bash -n speed-bench/cuda-prefill-audit.sh
          bash -n speed-bench/cuda-prefill-deep-audit.sh
          bash -n speed-bench/cuda-q4-prefill-evidence.sh
          test -x speed-bench/cuda-q4-real-histogram.sh
          bash -n speed-bench/cuda-q4-real-histogram.sh
          test -x speed-bench/cuda-q4-post-scalar-trace.sh
          bash -n speed-bench/cuda-q4-post-scalar-trace.sh
          test -x speed-bench/cuda-q4-layout-cache-ab.sh
          bash -n speed-bench/cuda-q4-layout-cache-ab.sh
          bash -n speed-bench/cuda-sm75-kernel-profile.sh
          bash -n speed-bench/cuda-sm75-int4-mma-experiment.sh
          bash -n speed-bench/cuda-sm75-q4-down-native.sh
          test -x speed-bench/cuda-sm75-q4-gate-up-native.sh
          bash -n speed-bench/cuda-sm75-q4-gate-up-native.sh
          test -x speed-bench/cuda-sm75-production-scalar.sh
          bash -n speed-bench/cuda-sm75-production-scalar.sh
          test -x speed-bench/cuda-sm75-production-scalar-e2e.sh
          bash -n speed-bench/cuda-sm75-production-scalar-e2e.sh
          test -x speed-bench/cuda-sm75-native-q4-production.sh
          bash -n speed-bench/cuda-sm75-native-q4-production.sh
          test -x speed-bench/cuda-sm75-native-q4-next-ab.sh
          bash -n speed-bench/cuda-sm75-native-q4-next-ab.sh
          test -x speed-bench/cuda-sm75-native-q4-gate-fused-ab.sh
          bash -n speed-bench/cuda-sm75-native-q4-gate-fused-ab.sh
          test -x speed-bench/cuda-sm75-q4-persistent.sh
          bash -n speed-bench/cuda-sm75-q4-persistent.sh
          bash -n speed-bench/cuda-q8-partner-offload-ab.sh
          bash -n speed-bench/cuda-q8-t32-fused-ab.sh
          python3 - <<'PY'
          from pathlib import Path
          source = Path("speed-bench/cuda-sm75-production-scalar-e2e.sh").read_text()
          start = source.index("<<'PY'\n") + len("<<'PY'\n")
          end = source.index("\nPY\n", start)
          compile(source[start:end], "<scalar-e2e-summary>", "exec")
          PY
          bash -n speed-bench/cuda-sm75-next-targets.sh
          python3 -m py_compile speed-bench/validate-ncu-capture.py
          python3 -m py_compile speed-bench/summarize-prefill-placement.py
          python3 -m py_compile speed-bench/summarize-tile-audit.py
          python3 -m py_compile speed-bench/summarize-q8-cache-audit.py
          python3 -m py_compile speed-bench/summarize-q8-partner-offload-ab.py
          python3 tests/test_summarize_q8_partner_offload_ab.py
          python3 -m py_compile speed-bench/summarize-q8-t32-fused-ab.py
