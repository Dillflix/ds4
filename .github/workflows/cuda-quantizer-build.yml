          grep -Eq 'IMMA\.8832\.S4\.U4' /tmp/sm75_q3_32_kernel.sass
          ! grep -Eq 'IMMA[^[:space:]]*8816|IMMA\.8816' \
            /tmp/sm75_q3_32_kernel.sass
          grep -Eq 'IMMA\.8832\.U4\.S4' /tmp/sm75_q4_32_kernel.sass
          grep -Eq 'IMMA\.8832\.S4\.S4' /tmp/sm75_q4_32_kernel.sass
          ! grep -Eq 'IMMA[^[:space:]]*8816|IMMA\.8816' \
            /tmp/sm75_q4_32_kernel.sass
          q4k_total=$(grep -Ec 'IMMA' /tmp/sm75_q4k_native_control_kernel.sass)
          q4k_u4u4=$(grep -Ec 'IMMA[^[:space:]]*8832[^[:space:]]*U4[^[:space:]]*U4' \
            /tmp/sm75_q4k_native_control_kernel.sass)
          q4k_s4u4=$(grep -Ec 'IMMA[^[:space:]]*8832[^[:space:]]*S4[^[:space:]]*U4' \
            /tmp/sm75_q4k_native_control_kernel.sass)
