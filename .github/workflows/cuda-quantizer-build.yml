          q3k_total=$(grep -Ec 'IMMA' /tmp/sm75_q3k_k16_u8_kernel.sass)
          q3k_s8u8=$(grep -Ec 'IMMA[^[:space:]]*8816[^[:space:]]*S8[^[:space:]]*U8' \
            /tmp/sm75_q3k_k16_u8_kernel.sass)
          test "$q3k_total" -eq "$q3k_s8u8"
          q3_total=$(grep -Ec 'IMMA' /tmp/sm75_q3_32_kernel.sass)
          q3_u4u4=$(grep -Ec 'IMMA[^[:space:]]*8832[^[:space:]]*U4[^[:space:]]*U4' \
            /tmp/sm75_q3_32_kernel.sass)
          q3_s4u4=$(grep -Ec 'IMMA[^[:space:]]*8832[^[:space:]]*S4[^[:space:]]*U4' \
            /tmp/sm75_q3_32_kernel.sass)
          test "$q3_total" -eq "$((q3_u4u4 + q3_s4u4))"
          q4_total=$(grep -Ec 'IMMA' /tmp/sm75_q4_32_kernel.sass)
          q4_u4s4=$(grep -Ec 'IMMA[^[:space:]]*8832[^[:space:]]*U4[^[:space:]]*S4' \
            /tmp/sm75_q4_32_kernel.sass)
          q4_s4s4=$(grep -Ec 'IMMA[^[:space:]]*8832[^[:space:]]*S4[^[:space:]]*S4' \
            /tmp/sm75_q4_32_kernel.sass)
          test "$q4_total" -eq "$((q4_u4s4 + q4_s4s4))"
          for kernel in \
            sm75_q4k_native_control_kernel \
            sm75_q3k_k16_u8_kernel \
            sm75_q3_32_kernel \
            sm75_q4_32_kernel; do
            ! grep -Eq '(^|[[:space:]])(LDL|STL)([[:space:].]|$)' "/tmp/$kernel.sass"
            ! grep -Eq 'IDP[.]4A|DP4A' "/tmp/$kernel.sass"
