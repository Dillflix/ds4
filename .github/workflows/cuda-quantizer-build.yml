          grep -Eq 'IMMA[^[:space:]]*8816|IMMA\.8816' /tmp/sm75-int4.sass
          grep -Eq 'IMMA[^[:space:]]*8832|IMMA\.8832' /tmp/sm75-int4.sass
      - name: Verify SM75 Q3 and Q4-32 instructions
        run: |
          cuobjdump --list-elf tests/cuda_sm75_q3_q4_32 |
            grep -Eq '\.sm_75\.cubin([[:space:]]|$)'
          cuobjdump --dump-sass tests/cuda_sm75_q3_q4_32 > /tmp/sm75-q3-q4-32.sass
          for kernel in \
            sm75_q4k_native_control_kernel \
            sm75_q3k_k16_u8_kernel \
            sm75_q3_32_kernel \
            sm75_q4_32_kernel; do
            grep -q "Function : $kernel" /tmp/sm75-q3-q4-32.sass
            awk -v wanted="$kernel" '
              /Function : / {
                name=$0
                sub(/^.*Function :[[:space:]]*/, "", name)
                sub(/[[:space:]]*$/, "", name)
                emit=name == wanted
              }
              emit { print }
            ' /tmp/sm75-q3-q4-32.sass > "/tmp/$kernel.sass"
          done
          grep -Eq 'IMMA\.8832\.U4\.U4' /tmp/sm75_q4k_native_control_kernel.sass
          grep -Eq 'IMMA\.8832\.S4\.U4' /tmp/sm75_q4k_native_control_kernel.sass
          ! grep -Eq 'IMMA[^[:space:]]*8816|IMMA\.8816' \
            /tmp/sm75_q4k_native_control_kernel.sass
          grep -Eq 'IMMA\.8816\.S8\.U8|IMMA[^[:space:]]*8816[^[:space:]]*S8[^[:space:]]*U8' \
            /tmp/sm75_q3k_k16_u8_kernel.sass
          ! grep -Eq 'IMMA[^[:space:]]*8832|IMMA\.8832' \
            /tmp/sm75_q3k_k16_u8_kernel.sass
